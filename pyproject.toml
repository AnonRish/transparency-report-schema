[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transparency-report-schema"
version = "0.1.0"
description = "Schema, validator, policy checker, diff and signing tools for frontier-AI transparency reports (model specs, spec adherence, internal compute use, qualitative notes)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AnonRish" }]
keywords = ["ai-governance", "transparency", "pydantic", "json-schema", "ed25519"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "cryptography>=42"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "jsonschema>=4.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
trs = "transparency_report_schema.cli:main"

[project.urls]
Homepage = "https://github.com/AnonRish/transparency-report-schema"
Issues = "https://github.com/AnonRish/transparency-report-schema/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transparency_report_schema = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=transparency_report_schema --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = ["slow: statistical calibration tests that take longer to run"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
